<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Table withot style</title>
    </head>
    <style>
        table , th , td{
            border: 1px solid red;
            border-spacing: 0px;
        }
        tbody{
            background-color: black;
            color: white;
        }
        th , td{
            padding: 2px;
        }
        thead{
            background-color: yellow;
        }
        tfoot{
            text-align: right;
        }
        caption{
            color: blue;
        }
    </style>
    <body>
        <h1>Table without style</h1>
        <table>
            <caption>Table Demo</caption>
            <thead>
                <tr> 
                    <th>column1</th>
                    <th>column2</th>
                    <th>column3</th>
                </tr>
                <tbody>
                    <tr>
                        <td rowspan="2">data co1-row1</td>
                        <td>data co2-row1</td>
                        <td>data co3-row1</td>

                    </tr>

                    <tr>
                     <!--<td>data co1-row1</td>-->
                        <td>data co2-row2</td>
                        <td>data co3-row3</td>

                    </tr>

                    <tr>
                        <td>data co1-row3</td>
                        <td>data co2-row3</td>
                     <!--<td>data co3-row3</td>-->
                    </tr>


                </tfoot>
                <tr>
                    <td>Total1</td>
                    <td>Total2</td>
                    <td>Total3</td>
                </tr>







            </thead>








        </table>


















    </body>






























</html>
